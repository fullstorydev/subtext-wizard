name: Sync install pages

# The marketing site owns the install instructions. This pulls the current
# pages into src/installPages/pages.generated.ts and opens a PR when they
# change, so text edits reach headless installs only after review.

on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
  # The site's deploy can send this to sync right away instead of waiting.
  repository_dispatch:
    types: [install-pages-updated]

concurrency:
  group: sync-install-pages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch install pages
        run: node scripts/sync-install-pages.mjs

      - name: Check the snapshot
        run: npm run typecheck && npm test

      - name: Add a changeset if the pages changed
        run: |
          if ! git diff --quiet -- src/installPages/pages.generated.ts; then
            printf -- "---\n'@subtextdev/subtext-wizard': patch\n---\n\nSync install instructions from the Subtext site.\n" > .changeset/sync-install-pages.md
          fi

      # PRs opened with GITHUB_TOKEN don't trigger ci.yml. Set the
      # INSTALL_PAGES_SYNC_TOKEN secret (GitHub App or fine-grained PAT) to
      # get CI on the sync PR.
      - name: Open or update the sync PR
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.INSTALL_PAGES_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/sync-install-pages
          title: Sync install pages from the Subtext site
          commit-message: Sync install pages from the Subtext site
          body: Automated sync of `src/installPages/pages.generated.ts` from https://subtext.fullstory.com/install. Review the text diff before merging.
          add-paths: |
            src/installPages/pages.generated.ts
            .changeset/sync-install-pages.md
          delete-branch: true
